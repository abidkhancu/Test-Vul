version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vuln_platform
      POSTGRES_USER: vuln_platform
      POSTGRES_PASSWORD: changeme_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      VULN_ENV: dev
      VULN_DATABASE_HOST: postgres
      VULN_DATABASE_PASSWORD: changeme_local_dev_only
      VULN_DATABASE_SSL_MODE: disable
      VULN_REDIS_ADDR: redis:6379
      VULN_LOG_LEVEL: debug
    ports:
      - "8080:8080"

volumes:
  pgdata:
