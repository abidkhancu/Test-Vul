apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vuln-platform-api
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # This app handles multipart XLSX uploads up to
    # import.max_file_size_mb (default 200MB) — raise the proxy body
    # size limit to match, or large scanner report uploads will fail
    # at the ingress before ever reaching the app.
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # cert-manager annotation — remove if TLS is terminated elsewhere
    # (e.g. an upstream load balancer) rather than at this ingress.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - vuln-platform.ubank.example
      secretName: vuln-platform-tls
  rules:
    - host: vuln-platform.ubank.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vuln-platform-api
                port:
                  name: http
