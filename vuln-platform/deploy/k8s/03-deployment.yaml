apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-platform-api
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vuln-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vuln-platform
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: vuln-platform
      # Security posture: no root, no privilege escalation, read-only
      # root filesystem (the app only ever writes to the mounted
      # uploads/reports volumes, never elsewhere) — appropriate given
      # this holds SSH credentials for a production banking fleet.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REGISTRY_PLACEHOLDER/vuln-platform:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vuln-platform-config
            - secretRef:
                name: vuln-platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /tmp/vuln-platform-uploads
            - name: reports
              mountPath: /tmp/vuln-platform-reports
            - name: tmp
              mountPath: /tmp
          # Liveness: is the process alive at all. Never checks the
          # DB — a slow DB shouldn't cause a pod restart storm.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: can this pod actually serve traffic (checks DB
          # connectivity). A pod failing this gets pulled from the
          # Service's endpoints, not restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                # Give in-flight SSH verification/patch sessions and
                # HTTP requests a moment to drain before SIGTERM,
                # rather than cutting a running verification pass or
                # (far worse) a patch execution off mid-command.
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: uploads
          emptyDir:
            sizeLimit: 2Gi
        - name: reports
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # Spread replicas across nodes — with only 2 replicas and
      # maxUnavailable: 0 above, losing both to a single node failure
      # would still cause an outage without this.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vuln-platform
              app.kubernetes.io/component: api
