# Restricts what the API pods can talk to. This matters more than
# usual for this application: it holds decrypted SSH credentials
# in-memory during connection setup and reaches out to production
# RHEL hosts. An overly permissive egress policy here would undercut
# the whole "encrypted at rest, minimized in memory" credential
# handling story in internal/crypto and internal/usecase/ssh.
#
# Adjust the SSH egress CIDR blocks to your actual managed-fleet
# ranges (and jump-host ranges, since usecase/ssh.Dialer tunnels
# through those) — 0.0.0.0/0 on port 22 defeats the purpose of having
# this policy at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vuln-platform-api-egress
  namespace: vuln-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vuln-platform
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - ports:
        - protocol: TCP
          port: 5432
    # Redis
    - ports:
        - protocol: TCP
          port: 6379
    # HTTPS (package/advisory metadata sync, if that job runs from
    # this same service in a future slice)
    - ports:
        - protocol: TCP
          port: 443
    # SSH to the managed RHEL fleet — REPLACE with your real CIDR
    # ranges (Islamabad primary / Karachi DR management subnets, jump
    # host subnet) before applying this in a real cluster.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 22
