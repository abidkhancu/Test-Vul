# Runs migrations/*.sql against the target database before the app
# Deployment is expected to serve traffic. Wire this as a Helm
# pre-upgrade/pre-install hook (see helm/templates/migrate-job.yaml)
# or run manually with `kubectl apply -f` + `kubectl wait` in a CI/CD
# pipeline step before rolling the Deployment.
#
# Uses golang-migrate's official image rather than shipping a custom
# migration binary — one less thing for this application's Docker
# image to own. Mounts migrations/ as a ConfigMap (see the `create
# configmap --from-file=migrations/` step in ci-cd.yml) so the SQL
# lives in version control, not baked into an image that then needs
# rebuilding for a schema-only change.
apiVersion: batch/v1
kind: Job
metadata:
  name: vuln-platform-migrate
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vuln-platform
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args:
            - "-path=/migrations"
            - "-database"
            - "postgres://$(VULN_DATABASE_USER):$(VULN_DATABASE_PASSWORD)@$(VULN_DATABASE_HOST):$(VULN_DATABASE_PORT)/$(VULN_DATABASE_NAME)?sslmode=$(VULN_DATABASE_SSL_MODE)"
            - "up"
          envFrom:
            - configMapRef:
                name: vuln-platform-config
            - secretRef:
                name: vuln-platform-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: vuln-platform-migrations
