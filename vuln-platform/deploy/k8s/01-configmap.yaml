# Non-secret configuration only. Anything with credential material
# (DB password, JWT signing key, credential-encryption key, seed admin
# password) belongs in 01-secret.yaml, never here — ConfigMaps are not
# encrypted at rest by default the way Secrets can be (with a KMS
# provider configured) and are far more commonly over-shared via RBAC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vuln-platform-config
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
data:
  VULN_ENV: "prod"
  VULN_HTTP_PORT: "8080"
  VULN_DATABASE_HOST: "vuln-platform-postgres"
  VULN_DATABASE_PORT: "5432"
  VULN_DATABASE_NAME: "vuln_platform"
  VULN_DATABASE_USER: "vuln_platform"
  VULN_DATABASE_SSL_MODE: "require"
  VULN_DATABASE_MAX_CONNS: "25"
  VULN_DATABASE_MIN_CONNS: "5"
  VULN_REDIS_ADDR: "vuln-platform-redis:6379"
  VULN_SSH_STRICT_HOST_KEY_CHECK: "true"
  VULN_SSH_MAX_CONCURRENT: "50"
  VULN_SSH_MAX_RETRIES: "2"
  VULN_IMPORT_WORKER_CONCURRENCY: "8"
  VULN_IMPORT_QUEUE_DEPTH: "200"
  VULN_IMPORT_MAX_FILE_SIZE_MB: "200"
  VULN_SAFETY_ALLOW_FULL_SYSTEM_UPDATE: "false"
  VULN_LOG_LEVEL: "info"
