apiVersion: v1
kind: Service
metadata:
  name: vuln-platform-api
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vuln-platform
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vuln-platform-api
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vuln-platform
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vuln-platform-api
  namespace: vuln-platform
  labels:
    app.kubernetes.io/name: vuln-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vuln-platform-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Scale up quickly (import bursts, large XLSX uploads triggering
    # worker pool load) but scale down cautiously to avoid flapping
    # during a verification sweep.
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
