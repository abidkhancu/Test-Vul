{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vuln-platform.fullname" . }}-egress
  labels:
    {{- include "vuln-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vuln-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: {{ .Values.config.database.port }}
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.sshEgressCIDR }}
      ports:
        - protocol: TCP
          port: 22
{{- end }}
