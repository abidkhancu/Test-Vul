{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vuln-platform.fullname" . }}-migrations
  labels:
    {{- include "vuln-platform.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/migrations/*.sql" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
# Helm hook: runs as a fresh Job before every install/upgrade,
# blocking the release from proceeding until migrations succeed
# (hook-failed policy leaves the failed Job around for `kubectl logs`
# rather than deleting evidence of what went wrong).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vuln-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "vuln-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "vuln-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args:
            - "-path=/migrations"
            - "-database"
            - "postgres://$(VULN_DATABASE_USER):$(VULN_DATABASE_PASSWORD)@$(VULN_DATABASE_HOST):$(VULN_DATABASE_PORT)/$(VULN_DATABASE_NAME)?sslmode=$(VULN_DATABASE_SSL_MODE)"
            - "up"
          envFrom:
            - configMapRef:
                name: {{ include "vuln-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "vuln-platform.fullname" . }}-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ include "vuln-platform.fullname" . }}-migrations
{{- end }}
