{{- if not .Values.secrets.managedExternally }}
# Templated only when secrets.managedExternally is false (the
# default, for getting a first deploy running quickly). For a real
# production rollout, set secrets.managedExternally: true and
# provision this Secret out of band (Vault, External Secrets
# Operator, Sealed Secrets) instead of via `helm --set`, which leaves
# plaintext secrets in `helm history` and shell history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vuln-platform.fullname" . }}-secrets
  labels:
    {{- include "vuln-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  VULN_DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  VULN_REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  VULN_AUTH_JWT_SIGNING_KEY: {{ .Values.secrets.jwtSigningKey | quote }}
  VULN_AUTH_CREDENTIAL_ENCRYPTION_KEY: {{ .Values.secrets.credentialEncryptionKey | quote }}
  {{- if .Values.secrets.seedAdmin.username }}
  VULN_SEED_ADMIN_USERNAME: {{ .Values.secrets.seedAdmin.username | quote }}
  VULN_SEED_ADMIN_EMAIL: {{ .Values.secrets.seedAdmin.email | quote }}
  VULN_SEED_ADMIN_PASSWORD: {{ .Values.secrets.seedAdmin.password | quote }}
  {{- end }}
{{- end }}
