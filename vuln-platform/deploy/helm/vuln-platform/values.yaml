# Default values for vuln-platform. Override per-environment with
# -f values-prod.yaml / --set flags, e.g.:
#   helm upgrade --install vuln-platform ./deploy/helm/vuln-platform \
#     -f values-prod.yaml \
#     --set image.tag=$(git rev-parse --short HEAD)

replicaCount: 2

image:
  repository: REGISTRY_PLACEHOLDER/vuln-platform
  tag: "" # defaults to .Chart.AppVersion if empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: vuln-platform.ubank.example
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vuln-platform-tls
      hosts:
        - vuln-platform.ubank.example

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Restrict to your actual managed-fleet CIDR ranges before deploying
  # to a real cluster — see the same note in deploy/k8s/06-networkpolicy.yaml.
  sshEgressCIDR: "10.0.0.0/8"

topologySpread:
  enabled: true
  maxSkew: 1

# --- Application configuration ---
# Non-secret values become the ConfigMap; anything secret goes under
# `secrets:` below, which is templated into a Kubernetes Secret. For
# real deployments, prefer external-secrets/Vault/Sealed Secrets over
# plain `--set secrets.xxx=` on the CLI (which lands in shell
# history and Helm release history in plaintext).
config:
  env: prod
  httpPort: 8080
  database:
    host: vuln-platform-postgres
    port: 5432
    name: vuln_platform
    user: vuln_platform
    sslMode: require
    maxConns: 25
    minConns: 5
  redis:
    addr: vuln-platform-redis:6379
  ssh:
    strictHostKeyCheck: true
    maxConcurrent: 50
    maxRetries: 2
  importer:
    workerConcurrency: 8
    queueDepth: 200
    maxFileSizeMB: 200
  safety:
    allowFullSystemUpdate: false
  logLevel: info

# Set these via --set-string or a values file that is NOT committed to
# git (e.g. values-secrets.yaml added to .gitignore), or better, via
# an external secrets operator that populates the Secret out of band
# and set `secrets.managedExternally: true` to skip templating one
# here at all.
secrets:
  managedExternally: false
  databasePassword: ""
  redisPassword: ""
  jwtSigningKey: ""
  credentialEncryptionKey: "" # must be exactly 32 bytes
  seedAdmin:
    username: ""
    email: ""
    password: ""

# Path (relative to the chart) to the SQL migration files, packaged
# into a ConfigMap and mounted into the pre-install/pre-upgrade
# migration Job. Keep in sync with ../../../migrations.
migrations:
  enabled: true
